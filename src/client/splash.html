<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hell Dice Shooter</title>
    <style>
    body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #0a0a0c;
      color: #e8e8ec;
      font-family: Impact, 'Arial Black', system-ui, sans-serif;
    }
    main {
      display: grid;
      gap: 1.25rem;
      justify-items: center;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff2200;
      text-shadow: 0 0 8px #ff0000;
    }
    p {
      margin: 0;
      max-width: 28rem;
      line-height: 1.5;
      color: #b8b8c0;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }
    button {
      border: 2px solid #3a3a42;
      background: rgba(10, 10, 12, 0.9);
      color: #00ff41;
      padding: 0.85rem 2rem;
      font: inherit;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
    }
    button:hover {
      border-color: #00ff41;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Hell Dice Shooter</h1>
      <p>주사위 족보로 무기를 바꾸며 끝없는 지옥 복도를 질주하는 러너 슈터</p>
      <button id="start-btn" type="button">Play</button>
    </main>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
